<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <g id="bulb">
      <circle r="7" fill="currentColor" opacity="0.25"/>
      <circle r="3.5" fill="currentColor"/>
    </g>
  </defs>

  <!-- star on top -->
  <circle cx="200" cy="20" r="16" fill="#e8b45e" opacity="0.22"/>
  <polygon points="200,8 202.9,15.9 211.4,16.3 204.8,21.6 207.1,29.7 200,25 192.9,29.7 195.2,21.6 188.6,16.3 197.1,15.9" fill="#e8b45e"/>

  <!-- tree tiers -->
  <polygon points="200,38 145,92 255,92" fill="#3d7a55" stroke="#3d7a55" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="200,78 125,136 275,136" fill="#33684a" stroke="#33684a" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="200,118 105,176 295,176" fill="#2a5740" stroke="#2a5740" stroke-width="6" stroke-linejoin="round"/>

  <!-- trunk -->
  <rect x="188" y="176" width="24" height="18" rx="3" fill="#6b4a34"/>

  <!-- light wires -->
  <path d="M160 72 Q200 88 240 72" fill="none" stroke="#4a2c1c" stroke-width="1.5"/>
  <path d="M130 118 Q200 138 270 118" fill="none" stroke="#4a2c1c" stroke-width="1.5"/>
  <path d="M115 152 Q200 176 285 152" fill="none" stroke="#4a2c1c" stroke-width="1.5"/>

  <!-- bulbs (colors match the LightGarland palette) -->
  <use href="#bulb" x="180" y="78" color="#e8b45e"/>
  <use href="#bulb" x="200" y="80" color="#e05545"/>
  <use href="#bulb" x="220" y="78" color="#4caf7d"/>
  <use href="#bulb" x="158" y="124" color="#f6ead9"/>
  <use href="#bulb" x="186" y="128" color="#e8b45e"/>
  <use href="#bulb" x="200" y="128" color="#e05545"/>
  <use href="#bulb" x="214" y="128" color="#4caf7d"/>
  <use href="#bulb" x="242" y="124" color="#f6ead9"/>
  <use href="#bulb" x="149" y="160" color="#e8b45e"/>
  <use href="#bulb" x="183" y="164" color="#e05545"/>
  <use href="#bulb" x="200" y="164" color="#4caf7d"/>
  <use href="#bulb" x="217" y="164" color="#f6ead9"/>
  <use href="#bulb" x="251" y="160" color="#e8b45e"/>
</svg>
